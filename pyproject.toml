[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfs"
version = "0.1.0"
description = "Machine learning algorithms implemented from scratch"
requires-python = ">=3.12"
dependencies = [
    "numpy"
]

[tool.setuptools.packages.find]
where = ["python"]
